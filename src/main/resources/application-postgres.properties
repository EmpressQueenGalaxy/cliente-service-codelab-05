# Perfil opcional: activar con --spring.profiles.active=postgres
# Requiere PostgreSQL local disponible y DB_PASSWORD configurada.
spring.datasource.url=jdbc:postgresql://localhost:5432/curso_springboot
spring.datasource.username=devdb
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
